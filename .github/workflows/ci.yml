name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm pack --pack-destination /tmp
      - run: npm install -g /tmp/reins-*.tgz
      - run: reins --version
      - run: reins policy eval "npm test"
      - name: full lifecycle smoke (isolated HOME)
        run: |
          export HOME=$(mktemp -d)
          reins init claude
          set +e
          echo '{"session_id":"ci","tool_name":"Bash","tool_input":{"command":"rm -rf /x"}}' | reins hook claude
          hook_ec=$?
          set -e
          echo "hook exit=$hook_ec (expect 2)"
          test "$hook_ec" -eq 2
          reins trace export --format ndjson | grep -q rm-recursive
          reins uninstall claude
          ! grep -q "reins hook" "$HOME/.claude/settings.json"
