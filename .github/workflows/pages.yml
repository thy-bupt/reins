name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/landing.html", "docs/demo-*.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Pages builds and deploys from the docs/ folder. See repo Settings → Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages publish at a time; drop the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
